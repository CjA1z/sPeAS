<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password - sPeAS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f5f7f6;
      color: #1f2d27;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d7e3dc;
      border-radius: 12px;
      padding: 32px;
      width: min(400px, calc(100vw - 32px));
      box-shadow: 0 12px 32px rgba(4, 105, 55, 0.08);
    }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p.hint { margin: 0 0 20px; color: #5b6f66; font-size: 0.92rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #c3d4cb;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 11px;
      background: #046937;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .message { margin-top: 14px; font-size: 0.92rem; }
    .message.error { color: #b3261e; }
    .message.success { color: #046937; }
    a { color: #046937; }
  </style>
</head>
<body>
  <form class="card" id="reset-form">
    <h1>Choose a new password</h1>
    <p class="hint">Enter a new password for your sPeAS account.</p>
    <label for="new-password">New password</label>
    <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
    <label for="confirm-password">Confirm new password</label>
    <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="reset-submit">Reset password</button>
    <div class="message" id="reset-message" role="status"></div>
  </form>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const form = document.getElementById('reset-form');
      const message = document.getElementById('reset-message');
      const submit = document.getElementById('reset-submit');

      function show(text, kind) {
        message.textContent = text;
        message.className = 'message ' + (kind || '');
      }

      if (!token || params.get('error')) {
        show('This reset link is invalid or has expired. Please request a new one from the login page.', 'error');
        submit.disabled = true;
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        if (newPassword !== confirmPassword) {
          show('Passwords do not match.', 'error');
          return;
        }

        submit.disabled = true;
        show('Resetting…');
        try {
          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ newPassword: newPassword, token: token })
          });
          const data = await response.json().catch(function () { return null; });
          if (!response.ok) {
            show((data && data.message) || 'Reset failed. The link may have expired.', 'error');
            submit.disabled = false;
            return;
          }
          show('Password updated. Redirecting to login…', 'success');
          setTimeout(function () { window.location.href = '/log-in.html?reset=success'; }, 1500);
        } catch (_error) {
          show('Something went wrong. Please try again.', 'error');
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
