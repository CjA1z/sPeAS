services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peas-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8000"
      DENO_ENV: ${DENO_ENV:-development}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-peas_dev_password}
      PGDATABASE: peas_db
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:18080}
      PEAS_RELEASE_ID: ${PEAS_RELEASE_ID:-development}
      DOCUMENT_ACCESS_TOKEN_TTL_HOURS: ${DOCUMENT_ACCESS_TOKEN_TTL_HOURS:-168}
      STORAGE_ROOT: /app/storage
      NEWS_MEDIA_WORKER_ENABLED: "false"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_APP_URL:-http://localhost:18080}
      AUTH_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN:-spud.edu.ph}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
    ports:
      - "${APP_PORT:-18080}:8000"
    volumes:
      - peas-storage:/app/storage
      - peas-logs:/app/Deno/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "try { const response = await fetch('http://localhost:8000/ping'); Deno.exit(response.ok ? 0 : 1); } catch (_) { Deno.exit(1); }",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peas-media-worker
    command: ["deno", "task", "media-worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-peas_dev_password}
      PGDATABASE: peas_db
      STORAGE_ROOT: /app/storage
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    volumes:
      - peas-storage:/app/storage
    restart: unless-stopped

  abstract-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peas-abstract-worker
    command: ["deno", "task", "abstract:worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-peas_dev_password}
      PGDATABASE: peas_db
      STORAGE_ROOT: /app/storage
      PEAS_RELEASE_ID: ${PEAS_RELEASE_ID:-development}
      ABSTRACT_OCR_LANGUAGES: ${ABSTRACT_OCR_LANGUAGES:-eng+fil}
    volumes:
      - peas-storage:/app/storage
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: peas-db
    environment:
      POSTGRES_DB: peas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-peas_dev_password}
    volumes:
      - peas-postgres:/var/lib/postgresql/data
      - ./Deno/db:/peas-db:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  peas-postgres:
  peas-storage:
  peas-logs:
